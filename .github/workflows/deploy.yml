name: Déploiement GitHub Pages

# Build l'app et publie le contenu de dist/ sur la branche gh-pages.
# GitHub Pages doit être réglé sur « Deploy from a branch : gh-pages / (root) ».
on:
  push:
    branches: [master]
  workflow_dispatch: # permet un lancement manuel depuis l'onglet Actions

# contents: écrire sur gh-pages ; pages: forcer la publication du site.
permissions:
  contents: write
  pages: write

# Évite deux déploiements simultanés.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true # gh-pages ne garde que le dernier build (historique propre)

      # En mode « deploy from branch », GitHub ne relance pas toujours la
      # publication après un push fait par le GITHUB_TOKEN (protection anti-boucle).
      # On la déclenche donc explicitement pour que le site soit toujours à jour.
      - name: Force GitHub Pages publish
        run: |
          echo "Déclenchement de la publication GitHub Pages…"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
